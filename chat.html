    <main>
        <section class="page-header"><h1>Chat da SME</h1><p>Converse com a administração. Acesso disponível apenas para usuários autenticados.</p></section>
        <div class="page-container"><div class="chat-card" id="chat-root"></div></div>
    </main>

    <style>
        .chat-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 22px; }
        .chat-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
        .chat-title { font-size: 1.05rem; font-weight: 700; }
        .chat-note { color: var(--color-secondary); }
        .chat-panel { display: flex; gap: 18px; margin-top: 12px; }
        .chat-panel-left { width: 260px; min-width: 200px; border-right: 1px solid var(--color-border); padding-right: 12px; }
        .chat-panel-right { flex: 1; display: flex; flex-direction: column; }
        .chat-card-user { padding: 12px; border-radius: 10px; background: #f8fbff; border: 1px solid #d9e5f2; margin-bottom: 10px; cursor: pointer; }
        .chat-card-user.active { background: #003366; color: #fff; }
        .chat-list { max-height: 420px; overflow:auto; display:flex; flex-direction:column; gap:10px; padding-right:6px; }
        .chat-message { padding: 12px 14px; border-radius: 12px; background: #f8fbff; border: 1px solid #e5eef8; color: #1f2d3d; max-width: 72%; word-wrap: break-word; display:inline-block; }
        .chat-message.sent { align-self: flex-end; margin-left: auto; background-color: #d1e7dd; border-color: #bcdac8; text-align: right; }
        .chat-message.received { align-self: flex-start; margin-right: auto; background-color: #f8f9fa; border-color: #e6e9ec; text-align: left; }
        .chat-message .meta { font-size: 0.82rem; color: #5f6d7c; margin-bottom: 8px; }
        .chat-form { display: flex; gap: 10px; margin-top: 14px; }
        .chat-form textarea { flex: 1; min-height: 88px; border-radius: 12px; border: 1px solid var(--color-border); padding: 12px; resize: vertical; font-family: inherit; font-size: 0.95rem; }
        .chat-action { display:inline-flex; align-items:center; gap:8px; color:#fff; background:#0073c8; border:none; padding:10px 16px; border-radius:10px; cursor:pointer; }
        .chat-empty { padding: 28px 18px; text-align:center; color: #556a82; border-radius: 12px; background:#f8fbff; border:1px dashed #cfdce8; }
        .chat-user-info { margin-bottom: 10px; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 12px; background: #fff; }
        @media (max-width: 980px) { .chat-panel { flex-direction: column; } .chat-panel-left { width: 100%; border-right: none; padding-right: 0; border-bottom: 1px solid var(--color-border); padding-bottom: 16px; } }
    </style>

    <script src="JS/mobile-navbar.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/chat.js"></script>

</body>

</html>
